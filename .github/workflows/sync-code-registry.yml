name: Sync Code Registry

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync-code-registry:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for commit info

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run code registry sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run sync:code-registry

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Code Registry Sync Failed',
              body: `Code registry sync failed on commit ${context.sha}\n\nSee: ${context.payload.repository.html_url}/actions/runs/${context.runId}`,
              labels: ['bug', 'code-registry']
            })
